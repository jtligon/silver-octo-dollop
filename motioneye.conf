# motioneye.conf
# Default configuration for MotionEye

# Web server settings
webcontrol_port 8765
webcontrol_localhost off
webcontrol_parms 0

# Log settings
log_level info
log_file /var/log/motion/motion.log

# Camera settings
camera_id 1
camera_name KilnCam
camera_url http://localhost:8081
camera_username admin
camera_password mySpicyPassword

# Motion detection settings
motion_detection on
threshold 1500
noise_level 32
despeckle_filter EedDl
lightswitch_percent 10
lightswitch_frames 5

# Recording settings
movie_output on
movie_max_time 3600
movie_quality 75
movie_codec mkv
movie_filename %Y-%m-%d/%H-%M-%S

# Snapshot settings
snapshot_interval 0
snapshot_filename %Y-%m-%d/%H-%M-%S-snapshot

# Storage settings
target_dir /var/lib/motioneye

# SSL settings
ssl_cert /etc/motioneye/ssl/cert.pem
ssl_key /etc/motioneye/ssl/key.pem
ssl_enabled on

# Metrics settings
metrics_enabled off
metrics_port 8985 