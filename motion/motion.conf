# motion.conf
# Default configuration for the motion daemon

# Daemon settings
daemon on
pid_file /var/run/motion/motion.pid
log_file /var/log/motion/motion.log
log_level info

# Camera settings
camera_id 1
camera_name Default Camera

# Motion detection settings
threshold 1500
noise_level 32
despeckle_filter EedDl
lightswitch_percent 10
lightswitch_frames 5

# Recording settings
movie_output on
movie_max_time 3600
movie_quality 75
movie_codec mkv
movie_filename %Y-%m-%d/%H-%M-%S

# Snapshot settings
snapshot_interval 0
snapshot_filename %Y-%m-%d/%H-%M-%S-snapshot

# Storage settings
target_dir /var/lib/motioneye 