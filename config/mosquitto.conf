# Mosquitto MQTT Broker Configuration for Kiln Monitoring
# This broker runs on Fitlet2 (192.168.7.200) and serves Home Assistant on same network

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# Network settings
listener 1883 0.0.0.0
protocol mqtt

# WebSocket listener for web clients
listener 9001 0.0.0.0
protocol websockets

# Security settings
allow_anonymous true

# Connection settings
max_connections -1
max_queued_messages 1000
message_size_limit 0

# Retain settings for persistent data
max_inflight_messages 20
max_queued_messages 1000
persistent_client_expiration 2m

# Topics for kiln monitoring
# frigate/kiln/temperature/current
# frigate/kiln/temperature/target  
# frigate/kiln/status/firing
# frigate/kiln/status/errors
# frigate/kiln/ocr/raw 